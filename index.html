<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Music Player </title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <div class="body">
        <div class="container">

            <div class="player">
                <div class="card">
                    <h2>MUSIC PLAYER</h2>
                    <img id="cover"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLOsNttis8vm1Vl-Pg9fISfwflxsVvMU8UAg&s"
                        alt="song image">
                    <h4 id="songName">6 Am</h4>
                    <p id="singerName">Yo Yo Honey Singh - Glory</p>

                    <div class="control">
                        <i class="fa-solid fa-backward-step" id="previous"></i>

                        <i class="fa-solid fa-play" id="masterplay"></i>

                        <i class="fa-solid fa-forward-step" id="next"></i>

                    </div>
                </div>

            </div>
            <div class="songList">
                <!-- The list items will be injected here automatically -->
                <ul id="playlist"></ul>
            </div>


        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
